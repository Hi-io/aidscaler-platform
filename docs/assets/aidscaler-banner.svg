<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">AidScaler — Turn scattered signals into coordinated help.</title>
  <desc id="desc">An AI-native disaster-response platform powered by Gemini and deployed on Google Cloud. A network connects a reported need, supplies, transport and a receiving team.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12172b"/><stop offset="1" stop-color="#16182d"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#6eacff"/><stop offset=".48" stop-color="#a68aff"/><stop offset="1" stop-color="#e49bc7"/></linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#df9b8a"/><stop offset=".5" stop-color="#b4a0f2"/><stop offset="1" stop-color="#7fa7ee"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9b76f1" stop-opacity=".24"/><stop offset="1" stop-color="#9b76f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><path d="M48 0H0V48" fill="none" stroke="#9da4da" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect x="704" y="16" width="560" height="408" rx="20" fill="url(#grid)"/>
  <ellipse cx="994" cy="219" rx="240" ry="220" fill="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
