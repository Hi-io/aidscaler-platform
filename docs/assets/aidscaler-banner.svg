      <circle cx="11" cy="31" r="2.3" fill="#e3a08d"/>
      <circle cx="21" cy="12" r="2.3" fill="#b8acff"/>
      <circle cx="31" cy="31" r="2.3" fill="#b8acff"/>
      <text x="55" y="31" fill="#f3f2fb" font-size="32" font-weight="650" letter-spacing="-1">AidScaler</text>
    </g>
    <text x="54" y="129" fill="#b3b4cc" font-size="11" letter-spacing="2.4">AI-NATIVE DISASTER RESPONSE</text>
    <text x="51" y="194" fill="#f6f5ff" font-size="53" font-weight="550" letter-spacing="-1.7">Turn scattered signals</text>
    <text x="51" y="255" fill="url(#ai)" font-size="53" font-weight="550" letter-spacing="-1.7">into coordinated help.</text>
    <text x="54" y="301" fill="#b6b8ce" font-size="18">More capacity from existing resources.</text>
    <text x="54" y="329" fill="#b6b8ce" font-size="18">More time to protect lives.</text>
    <path d="M54 364H654" stroke="#36394f"/>
    <text x="54" y="396" fill="#c7b6fa" font-size="15" font-weight="500">Powered by Gemini</text>
    <circle cx="218" cy="391" r="2" fill="#6d718e"/>
    <text x="233" y="396" fill="#c6c9db" font-size="15">Deployed on Google Cloud</text>
